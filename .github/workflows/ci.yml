name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: python scripts/verify_release.py
      - run: python scripts/build_release.py
      - run: python -m bandit -r portainer_console.py engine.py persistence.py dashboard_metrics.py telemetry.py -ll
      - run: python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip
      - run: npm audit --audit-level=moderate

  docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - run: docker compose -p analytics-ci config --quiet
      - run: docker compose -p analytics-ci up -d --build --wait --wait-timeout 120
      - name: Check container and restart persistence
        run: python scripts/check_container.py --project analytics-ci
      - name: Capture service logs
        if: failure()
        run: docker compose -p analytics-ci logs --no-color
      - name: Remove this job's isolated deployment
        if: always()
        run: docker compose -p analytics-ci down --volumes
