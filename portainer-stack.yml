# Docker Standalone only: Swarm does not honor the loopback host binding.
# Build portainer-analytics:1.0.0 in this Docker environment first.
services:
  portainer-analytics:
    image: portainer-analytics:1.0.0
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      CONSOLE_PUBLIC_URL: ""
      CONSOLE_ALLOWED_HOSTS: ""
    volumes:
      - analytics-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
volumes:
  analytics-data:
